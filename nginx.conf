server {
  listen 3400;
  server_name _;

  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript;

  # A página fica em /html/index.html e referencia ../css e ../dist.
  # Servida na raiz, "../" é resolvido pelo navegador como "/", então os caminhos continuam válidos.
  location = / {
    rewrite ^ /html/index.html break;
  }

  location / {
    try_files $uri =404;
  }

  # Sem hash no nome do arquivo: revalidar sempre, para um novo deploy chegar aos usuários.
  location ~* \.(js|css)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
}
